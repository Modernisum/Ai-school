<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidhyam Auto-Fill</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 360px; font-family: 'Inter', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 16px; }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .header .logo { width: 28px; height: 28px; background: #6366f1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: white; }
    .header h1 { font-size: 16px; }
    .section { margin-bottom: 12px; }
    .section label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #64748b; margin-bottom: 4px; }
    select, input { width: 100%; padding: 8px 10px; background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0; font-size: 13px; }
    select:focus, input:focus { outline: none; border-color: #6366f1; }
    .btn { width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 4px; }
    .btn-primary { background: #6366f1; color: white; }
    .btn-primary:hover { background: #4f46e5; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: #1e293b; color: #6366f1; border: 1px solid #334155; }
    .status { font-size: 11px; padding: 8px; border-radius: 4px; margin-top: 8px; display: none; }
    .status.success { background: #065f46; color: #6ee7b7; display: block; }
    .status.error { background: #7f1d1d; color: #fca5a5; display: block; }
    .status.info { background: #1e3a5f; color: #93c5fd; display: block; }
    .student-card { background: #1e293b; border-radius: 6px; padding: 10px; margin-bottom: 6px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
    .student-card:hover { border-color: #6366f1; }
    .student-card.selected { border-color: #6366f1; background: #1e293b; }
    .student-card .name { font-weight: 600; font-size: 13px; }
    .student-card .meta { font-size: 10px; color: #64748b; margin-top: 2px; }
    .student-list { max-height: 200px; overflow-y: auto; }
    .url-badge { font-size: 10px; color: #64748b; background: #1e293b; padding: 4px 8px; border-radius: 4px; word-break: break-all; margin-top: 8px; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #334155; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">V</div>
    <h1>Vidhyam Auto-Fill</h1>
  </div>

  <div class="section">
    <label>API Base URL</label>
    <input type="text" id="apiBase" placeholder="http://localhost:8080/api" value="http://localhost:8080/api">
  </div>

  <div class="section">
    <label>JWT Token</label>
    <input type="password" id="token" placeholder="Bearer token from Vidhyam login">
  </div>

  <button class="btn btn-secondary" id="loadStudents">Load Students</button>

  <div class="section" style="margin-top:12px;">
    <label>Select Student</label>
    <div class="student-list" id="studentList"></div>
  </div>

  <div id="pageUrl" class="url-badge"></div>

  <button class="btn btn-primary" id="autoFillBtn" disabled>Auto-Fill Form</button>
  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
