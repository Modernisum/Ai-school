<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=400, initial-scale=1.0">
  <title>Vidhyam Autofill</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="screen">
    <div class="login-header">
      <div class="logo">V</div>
      <h1>Vidhyam Autofill</h1>
      <p class="subtitle">School Management Extension</p>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label for="schoolId">School ID</label>
        <input type="text" id="schoolId" placeholder="Enter your School ID" required autocomplete="off">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Enter password" required>
          <button type="button" id="togglePassword" class="toggle-btn" title="Show/Hide password">
            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label for="apiKey">API Key <span class="optional">(optional)</span></label>
        <input type="text" id="apiKey" placeholder="vk_xxxxxxxx_xxxxxxxx" autocomplete="off">
        <small class="hint">Generate from School Dashboard → Settings → API Keys</small>
      </div>
      <button type="submit" id="loginBtn" class="btn btn-primary btn-full">
        <span class="btn-text">Login</span>
        <span class="btn-loader" style="display:none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="spin">
            <circle cx="12" cy="12" r="10" stroke-dasharray="60" stroke-dashoffset="20"/>
          </svg>
        </span>
      </button>
      <div id="loginError" class="error-msg" style="display:none"></div>
    </form>
    <div class="login-footer">
      <button id="openSettings" class="link-btn">⚙️ Settings</button>
    </div>
  </div>

  <!-- DASHBOARD SCREEN -->
  <div id="dashboardScreen" class="screen" style="display:none">
    <!-- Header -->
    <div class="dash-header">
      <div class="school-info">
        <span class="school-badge">V</span>
        <div>
          <div class="school-name" id="schoolNameDisplay">School</div>
          <div class="school-id" id="schoolIdDisplay">ID</div>
        </div>
      </div>
      <button id="logoutBtn" class="btn-icon" title="Logout">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>

    <!-- Tab Toggle -->
    <div class="tab-toggle">
      <button class="tab-btn active" data-tab="student">👤 Student</button>
      <button class="tab-btn" data-tab="employee">💼 Employee</button>
    </div>

    <!-- Search Section -->
    <div class="search-section">
      <div class="search-bar">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search by name, ID, or phone..." autocomplete="off">
        <button id="clearSearch" class="clear-btn" style="display:none" title="Clear search">✕</button>
      </div>

      <!-- Filters -->
      <div class="filters" id="studentFilters">
        <select id="classFilter" class="filter-select">
          <option value="">All Classes</option>
        </select>
        <select id="sectionFilter" class="filter-select">
          <option value="">All Sections</option>
        </select>
      </div>
      <div class="filters" id="employeeFilters" style="display:none">
        <select id="empTypeFilter" class="filter-select">
          <option value="">All Types</option>
        </select>
      </div>

      <!-- Direct ID Lookup -->
      <div class="id-lookup">
        <input type="text" id="directIdInput" placeholder="Enter Student/Employee ID directly">
        <button id="lookupBtn" class="btn btn-sm">Fetch</button>
      </div>
    </div>

    <!-- Results Section -->
    <div id="resultsSection" class="results-section">
      <div class="results-header">
        <span id="resultsCount">0 results</span>
      </div>
      <div id="resultsList" class="results-list">
        <div class="empty-state">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="1.5">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <p>Search for a student or employee to get started</p>
        </div>
      </div>
    </div>

    <!-- Detail Panel (appears when a person is selected) -->
    <div id="detailPanel" class="detail-panel" style="display:none">
      <div class="detail-header">
        <button id="backToList" class="btn-icon" title="Back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <h3 id="detailName">Name</h3>
      </div>
      <div id="detailContent" class="detail-content">
        <!-- Dynamically populated -->
      </div>
      <button id="autofillBtn" class="btn btn-primary btn-full">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        Autofill This Page
      </button>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay" style="display:none">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
