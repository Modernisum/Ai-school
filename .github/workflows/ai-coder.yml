name: AI Developer Workflow

on:
  issues:
    types: [opened]

jobs:
  ai-coder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Kilo Code CLI
        run: |
          echo "Installing Kilo Code CLI..."
          npm install -g @kilocode/cli

      - name: Run Kilo Code
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          echo "Starting Kilo Code for Issue: $ISSUE_TITLE"
          kilo run "Solve this issue: $ISSUE_TITLE. Details: $ISSUE_BODY"
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "AI Fix for Issue #${{ github.event.issue.number }}"
          title: "AI-Generated PR: ${{ github.event.issue.title }}"
          body: "This PR was automatically generated by the AI workflow to resolve Issue #${{ github.event.issue.number }}."
          branch: "ai-fix-issue-${{ github.event.issue.number }}"
