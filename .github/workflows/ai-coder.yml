name: AI Developer Workflow

on:
  issues:
    types: [opened]

jobs:
  ai-coder:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install AI CLI (Aider)
        run: |
          echo "Installing Aider (Open-Source AI Pair Programmer)..."
          python -m pip install aider-chat

      - name: Run AI Coder
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          echo "Starting AI Developer for Issue: $ISSUE_TITLE"
          # Aider को बिना मैन्युअल अप्रूवल के रन करने के लिए --yes फ्लैग लगाया है
          aider --model openrouter/inclusionai/ring-2.6-1t:free --message "Solve this issue: $ISSUE_TITLE. Details: $ISSUE_BODY" --yes --no-auto-commits

        
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "AI Fix for Issue #${{ github.event.issue.number }}"
          title: "AI-Generated PR: ${{ github.event.issue.title }}"
          body: "This PR was automatically generated by the AI workflow to resolve Issue #${{ github.event.issue.number }}."
          branch: "ai-fix-issue-${{ github.event.issue.number }}"
