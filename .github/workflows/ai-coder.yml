name: AI Developer Workflow

on:
  issues:
    types: [opened]

jobs:
  ai-coder:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install AI CLI
        run: |
          echo "Installing your preferred AI CLI..."
          # यहाँ Kilo Code CLI इंस्टॉल करने का कमांड है। अगर कमांड अलग है तो इसे बदल सकते हैं।
          npm install -g kilo-code-cli 

      - name: Run AI Coder
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          echo "Starting AI Developer for Issue: $ISSUE_TITLE"
          # AI CLI को कमांड दें (अगर Kilo CLI का कमांड कुछ और है, तो इसे अपडेट कर लें)
          kilo-code task "$ISSUE_TITLE. Details: $ISSUE_BODY" --api-key $OPENROUTER_API_KEY
        
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "AI Fix for Issue #${{ github.event.issue.number }}"
          title: "AI-Generated PR: ${{ github.event.issue.title }}"
          body: "This PR was automatically generated by the AI workflow to resolve Issue #${{ github.event.issue.number }}."
          branch: "ai-fix-issue-${{ github.event.issue.number }}"
