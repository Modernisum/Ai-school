name: Vidhyam Portal CI

on:
  pull_request:
    paths:
      - 'frontend/Vidhyam/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
        working-directory: ./frontend/Vidhyam
      - run: npm run build
        working-directory: ./frontend/Vidhyam
