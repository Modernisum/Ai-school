name: Employee App CI (Flutter)

on:
  pull_request:
    paths:
      - 'Apps/employee/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0' # Adjust based on your project
          channel: 'stable'
      - run: flutter pub get
        working-directory: ./Apps/employee
      - run: flutter test
        working-directory: ./Apps/employee
