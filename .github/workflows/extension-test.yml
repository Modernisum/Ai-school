name: Chrome Extension CI

on:
  pull_request:
    paths:
      - 'modernschoolextension/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
        working-directory: ./modernschoolextension
      - run: npm run build
        working-directory: ./modernschoolextension
