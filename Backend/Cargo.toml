[package]
name = "backend"
version = "0.1.0"
edition = "2021"
authors = ["Modern School"]
license = "MIT"

[dependencies]
tokio = { version = "1.32", features = ["full"] }
axum = { version = "0.7", features = ["multipart", "ws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "=1.10.0", features = ["v4", "serde"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json", "bigdecimal"] }
bigdecimal = "0.3"
thiserror = "2.0"
sha2 = "0.10"
anyhow = "1.0"
deadpool-redis = "0.14"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport"] }
ring = "0.17"
rand = "0.8"
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "timeout", "compression-gzip"] }
dotenv = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
hex = "0.4"
hmac = "0.12"
sha1 = "0.10"
printpdf = "0.5"
jsonwebtoken = "9.2"
validator = { version = "0.19", features = ["derive"] }
async-stream = "0.3"
log = "0.4"
redis = { version = "0.24", features = ["tokio-comp", "tokio-rustls-comp"] }
getrandom = "0.2"
reqwest = { version = "0.11", features = ["json"] }
futures = "0.3"
bytes = "1.5"
base64 = "0.21"
parking_lot = "0.12"
dashmap = "5.5"
rayon = "1.8"
clap = { version = "4.4", features = ["derive"] }
walkdir = "2.4"
tempfile = "3.8"
flate2 = "1.0"
tar = "0.4"
bincode = "2.0"
crc32fast = "1.3"
argon2 = "0.5"
aes-gcm = "0.10"
http = "1.0"
hyper = { version = "1.0", features = ["server", "http1", "http2", "client"] }
tower = "0.4"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["codec", "compat", "io"] }
async-channel = "2.1"
crossbeam-channel = "0.5"
async-lock = "3.0"
async-mutex = "1.4"
async-io = "2.2"
blocking = "1.4"
mio = "0.8"
libc = "0.2"
qrcode = "0.14"
image = "0.25"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.11"