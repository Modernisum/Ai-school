services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: school_postgres
    environment:
      POSTGRES_USER: school_user
      POSTGRES_PASSWORD: school_password
      POSTGRES_DB: school_db
    ports:
      - "5433:5432"
    volumes:
      - school_pg_data:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_preload_libraries=vector
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U school_user -d school_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: school_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      target: ${RUST_ENV:-production}
      args:
        - FEATURES=
    image: school-backend:${RUST_ENV:-production}
    pull_policy: never
    container_name: school_backend
    ports:
      - "8080:8080"
    volumes:
      - ./models:/app/models
      - ./uploads:/app/uploads
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgres://school_user:school_password@postgres:5432/school_db
      - REDIS_URL=redis://redis:6379
      - RUST_ENV=${RUST_ENV:-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  school_pg_data:
